<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDP Spark Prompt Generator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #000000; /* Pure Black Theme */
            color: #f8fafc;
        }

        /* Glassmorphism effects adjusted for pure black */
        .glass-panel {
            background: #0a0a0a;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #27272a;
        }

        /* Custom Scrollbar for Textarea */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #000000; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #3f3f46; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #52525b; 
        }

        /* Animations */
        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(20px);
                max-height: 0;
            }
            to {
                opacity: 1;
                transform: translateY(0);
                max-height: 1000px; /* Arbitrary large height to allow slide down */
            }
        }

        .animate-reveal {
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            overflow: hidden;
        }
        
        .input-transition {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-8">

    <main class="w-full max-w-4xl flex-grow flex flex-col justify-center items-center my-8">
        
        <div class="glass-panel w-full rounded-3xl shadow-2xl p-6 sm:p-10 relative overflow-hidden">
            <!-- Decorative background glows (Subtle) -->
            <div class="absolute top-0 left-0 w-64 h-64 bg-zinc-800 rounded-full mix-blend-screen filter blur-3xl opacity-10 -translate-x-1/2 -translate-y-1/2"></div>
            <div class="absolute bottom-0 right-0 w-64 h-64 bg-zinc-800 rounded-full mix-blend-screen filter blur-3xl opacity-10 translate-x-1/2 translate-y-1/2"></div>

            <header class="mb-10 text-center relative z-10">
                <h1 class="text-3xl sm:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-zinc-500 mb-3 tracking-tight">
                    Spark KDP Prompt Generator
                </h1>
                <p class="text-zinc-400 text-sm sm:text-base max-w-2xl mx-auto">
                    Configure your book details below to generate a comprehensive prompt for the AI agent 'Spark' to create your entire KDP coloring book package.
                </p>
            </header>

            <form id="generatorForm" class="grid grid-cols-1 md:grid-cols-2 gap-6 relative z-10" onsubmit="event.preventDefault(); generatePrompt();">
                
                <div class="flex flex-col">
                    <label for="bookTitle" class="mb-2 text-sm font-medium text-zinc-300">Main Title</label>
                    <input type="text" id="bookTitle" placeholder="e.g. Magical Forest Animals" required
                        class="bg-black border border-zinc-800 rounded-xl p-3.5 text-white input-transition focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 shadow-inner">
                </div>

                <div class="flex flex-col">
                    <label for="bookSubtitle" class="mb-2 text-sm font-medium text-zinc-300">Subtitle</label>
                    <input type="text" id="bookSubtitle" placeholder="e.g. A Relaxing Coloring Book for Kids" 
                        class="bg-black border border-zinc-800 rounded-xl p-3.5 text-white input-transition focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 shadow-inner">
                </div>

                <div class="flex flex-col">
                    <label for="authorName" class="mb-2 text-sm font-medium text-zinc-300">Author Name</label>
                    <input type="text" id="authorName" placeholder="e.g. John Doe" required
                        class="bg-black border border-zinc-800 rounded-xl p-3.5 text-white input-transition focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 shadow-inner">
                </div>

                <div class="flex flex-col">
                    <label for="designStyle" class="mb-2 text-sm font-medium text-zinc-300">Design Style</label>
                    <div class="relative">
                        <select id="designStyle" class="appearance-none w-full bg-black border border-zinc-800 rounded-xl p-3.5 text-white input-transition focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 shadow-inner cursor-pointer">
                            <option value="Bold and Easy">Bold and Easy</option>
                            <option value="Mandala">Mandala</option>
                            <option value="Kawaii">Kawaii</option>
                            <option value="Minimalist">Minimalist</option>
                            <option value="Cute Animals">Cute Animals</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-zinc-500">
                            <i class="fas fa-chevron-down text-sm"></i>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col">
                    <label for="bookSize" class="mb-2 text-sm font-medium text-zinc-300">Book Size</label>
                    <div class="relative">
                        <select id="bookSize" class="appearance-none w-full bg-black border border-zinc-800 rounded-xl p-3.5 text-white input-transition focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 shadow-inner cursor-pointer">
                            <option value="8.5 x 11 inches">8.5" x 11"</option>
                            <option value="8.5 x 8.5 inches">8.5" x 8.5"</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-zinc-500">
                            <i class="fas fa-chevron-down text-sm"></i>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col">
                    <label for="numIllustrations" class="mb-2 text-sm font-medium text-zinc-300">Number of Illustrations</label>
                    <input type="number" id="numIllustrations" value="25" min="1" max="100" required
                        class="bg-black border border-zinc-800 rounded-xl p-3.5 text-white input-transition focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 shadow-inner">
                </div>

                <div class="md:col-span-2 mt-4 flex justify-center">
                    <button type="submit" class="group relative px-8 py-4 bg-zinc-900 border border-zinc-800 rounded-xl font-semibold text-white tracking-wide hover:border-zinc-600 hover:-translate-y-0.5 transition-all duration-300 overflow-hidden w-full md:w-auto min-w-[250px] shadow-lg">
                        <span class="relative z-10 flex items-center justify-center gap-2">
                            <i class="fas fa-bolt text-yellow-500/80"></i> Generate Spark Prompt
                        </span>
                        <div class="absolute inset-0 bg-white/5 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
                    </button>
                </div>
            </form>

            <div id="resultContainer" class="hidden mt-10 pt-8 border-t border-zinc-800/80 relative z-10">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-lg font-semibold text-zinc-200 flex items-center gap-2">
                        <i class="fas fa-terminal text-zinc-500"></i> AI Agent (Spark) Prompt
                    </h3>
                    <button onclick="copyPrompt()" id="copyBtn" class="flex items-center gap-2 text-sm font-medium bg-zinc-900 hover:bg-zinc-800 text-zinc-300 hover:text-white py-2 px-4 rounded-lg transition-all border border-zinc-800 hover:border-zinc-600 shadow-sm cursor-pointer">
                        <i id="copyIcon" class="far fa-copy"></i>
                        <span id="copyText">Copy</span>
                    </button>
                </div>
                
                <div class="relative group">
                    <textarea id="promptOutput" readonly
                        class="w-full h-[450px] bg-black border border-zinc-800 rounded-xl p-5 text-zinc-300 font-mono text-sm focus:outline-none focus:border-zinc-600 transition-colors leading-relaxed resize-y"></textarea>
                    
                    <div class="absolute top-4 right-4 pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity">
                        <span class="bg-zinc-900/80 text-zinc-400 text-xs px-2 py-1 rounded backdrop-blur-sm border border-zinc-800">Read Only</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full text-center py-6 mt-auto border-t border-zinc-900/50">
        <div class="flex flex-col md:flex-row items-center justify-center gap-4 md:gap-8">
            <span class="text-zinc-500 text-sm font-medium tracking-wide">
                © 2026 Khalid Fer. All rights reserved.
            </span>
            <div class="flex items-center gap-6">
                <a href="https://www.youtube.com/c/KhalidFer/" target="_blank" rel="noopener noreferrer" 
                   class="text-zinc-500 hover:text-white transition-colors flex items-center gap-2 text-sm font-medium">
                    <i class="fab fa-youtube text-lg text-red-900/50 hover:text-red-600 transition-colors"></i> YouTube Channel
                </a>
                <a href="mailto:dev.khalidfer@gmail.com" 
                   class="text-zinc-500 hover:text-white transition-colors flex items-center gap-2 text-sm font-medium">
                    <i class="far fa-envelope text-lg"></i> Email Me
                </a>
            </div>
        </div>
    </footer>

    <script>
        function generatePrompt() {
            // Retrieve values from the form inputs
            const title = document.getElementById('bookTitle').value.trim();
            const subtitle = document.getElementById('bookSubtitle').value.trim();
            const author = document.getElementById('authorName').value.trim();
            const style = document.getElementById('designStyle').value;
            const size = document.getElementById('bookSize').value;
            const illustrations = document.getElementById('numIllustrations').value;

            // Conditionally format subtitle strings
            const subtitleText = subtitle ? `\n- Subtitle: ${subtitle}` : '';

            // Construct the comprehensive prompt for Spark
            const prompt = `Hello Spark, act as an expert Amazon KDP coloring book creator and technical generator. I need you to generate a complete, publication-ready coloring book package based on the following specifications:

- Book Title: ${title}${subtitleText}
- Author Name: ${author}
- Design Style: ${style}
- Size: ${size} (with standard KDP bleed)
- Total Illustrations: ${illustrations}

Please generate and output the following 4 distinct items in their respective formats:

1. KDP Listing Assets (Text File)
Generate a complete, SEO-optimized text file containing:
- Main Title
- Subtitle
- An engaging HTML-formatted description ready to paste into KDP.
- Exactly 7 highly relevant, long-tail keyword phrases for backend search terms.

2. Cover Artwork (Image Files)
Generate two separate high-resolution image files:
- Front Cover: Must include the title and visually represent the '${style}' style with a colored example.
- Back Cover: A complementing design, leaving space for the KDP barcode.

3. Ready-to-Publish Interior (PDF File)
Generate and compile a complete interior PDF formatted exactly to ${size}. You MUST strictly follow this exact pagination structure to prevent bleed-through for colored markers:
- Page 1: A decorative "This book belongs to..." page.
- Page 2: Blank page.
- Page 3: Copyright page including the Title: "${title}" and Author: "${author}".
- Page 4: Blank page.
- Page 5: "Color Test Page" (specifically designed for testing markers/crayons).
- Page 6: Blank page.
- Page 7: Illustration 1 (strictly in the '${style}' style, black and white line art).
- Page 8: Blank page.
- Page 9: Illustration 2.
- Page 10: Blank page.
...Continue this exact alternating pattern (one illustration page followed by one blank page) until all ${illustrations} illustrations are completely accounted for.

4. Individual Illustrations (PNG Archive/Folder)
Generate and provide a downloadable archive or folder containing all ${illustrations} individual black-and-white coloring pages generated for the interior. These must be in high-quality PNG format.

Please ensure all outputs strictly adhere to these instructions.`;

            // Display the prompt in the textarea
            const outputArea = document.getElementById('promptOutput');
            outputArea.value = prompt;

            // Animate and reveal the result container
            const container = document.getElementById('resultContainer');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                
                // Remove animation class if it exists to reset it
                container.classList.remove('animate-reveal');
                // Trigger reflow to restart animation
                void container.offsetWidth; 
                
                container.classList.add('animate-reveal');
                
                // Scroll smoothly to the results area
                setTimeout(() => {
                    container.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            }
        }

        function copyPrompt() {
            const outputArea = document.getElementById('promptOutput');
            const copyBtn = document.getElementById('copyBtn');
            const copyIcon = document.getElementById('copyIcon');
            const copyText = document.getElementById('copyText');

            if (!outputArea.value) return;

            // Select text for copying
            outputArea.select();
            outputArea.setSelectionRange(0, 99999); // Mobile compatibility

            try {
                // Try modern Clipboard API first
                navigator.clipboard.writeText(outputArea.value).then(() => {
                    triggerSuccessState();
                }).catch(() => {
                    // Fallback to execCommand
                    document.execCommand('copy');
                    triggerSuccessState();
                });
            } catch (err) {
                // Ultimate fallback
                document.execCommand('copy');
                triggerSuccessState();
            }

            function triggerSuccessState() {
                // Update button UI to success state
                copyIcon.className = 'fas fa-check text-green-500';
                copyText.textContent = 'Copied!';
                copyBtn.classList.remove('bg-zinc-900', 'hover:bg-zinc-800', 'border-zinc-800');
                copyBtn.classList.add('bg-green-950/30', 'border-green-900/50', 'text-green-400');

                // Revert button UI after 2 seconds
                setTimeout(() => {
                    copyIcon.className = 'far fa-copy';
                    copyText.textContent = 'Copy';
                    copyBtn.classList.add('bg-zinc-900', 'hover:bg-zinc-800', 'border-zinc-800');
                    copyBtn.classList.remove('bg-green-950/30', 'border-green-900/50', 'text-green-400');
                }, 2000);
                
                // Clear the text selection
                window.getSelection().removeAllRanges();
            }
        }
    </script>
</body>
</html>
